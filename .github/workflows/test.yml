name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Callable, so the release gates on this suite itself rather than on a
  # copy of it that drifts out of step.
  workflow_call:

# A new commit on the same ref makes the run in progress pointless.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The pinned Home Assistant refuses to install on anything older.
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Format
        run: ruff format --check custom_components tests
      - name: Type check
        run: mypy --ignore-missing-imports custom_components/philips_homeid
      # ruff check is not here yet: the tree still has findings to clear, and
      # a check that is red from the first run tells nobody anything.
      - name: Tests
        env:
          PYTHONPATH: "."
        run: pytest tests/ -q
